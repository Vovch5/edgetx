name: Build V16 RU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: |
          sudo chmod -R 777 .
          docker run --rm -v "${{ github.workspace }}:/src" -w /src ghcr.io/edgetx/edgetx-builder:latest bash -c "
            mkdir -p build && cd build &&
            cmake -DPCB=X10 -DPCBREV=V16 -DTRANSLATIONS=RU -DCMAKE_BUILD_TYPE=Release .. &&
            make -j\$(nproc) firmware
          "

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: v16-ru-firmware
          path: build/**/firmware.bin
